<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#385648" />
      <stop offset="100%" stop-color="#23382F" />
    </linearGradient>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#EADBCE" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Pigeon silhouette & nest motif -->
  <g transform="translate(256, 240)">
    <!-- Pigeon icon stylized -->
    <path d="M-80,-60 C-80,-100 -40,-130 10,-120 C50,-110 70,-80 80,-50 C95,-45 130,-30 145,-10 C155,5 140,25 120,20 C100,16 90,25 80,45 C65,75 35,95 -5,95 C-55,95 -95,65 -95,20 C-95,-10 -90,-40 -80,-60 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="45" cy="-85" r="7" fill="#23382F" />
    <path d="M68,-85 L95,-80 L72,-70 Z" fill="#D8973C" />
    <path d="M-30,-20 C0,10 40,20 60,0 C50,-20 10,-35 -30,-20 Z" fill="#E2EBE5" opacity="0.8"/>
    
    <!-- Eggs in gentle nest -->
    <ellipse cx="-45" cy="80" rx="36" ry="46" transform="rotate(-15 -45 80)" fill="url(#eggGrad)" stroke="#C8B8A6" stroke-width="4"/>
    <ellipse cx="25" cy="82" rx="34" ry="44" transform="rotate(18 25 82)" fill="url(#eggGrad)" stroke="#C8B8A6" stroke-width="4"/>
    
    <!-- Nest base twigs -->
    <path d="M-110,105 Q0,135 110,105" stroke="#D8973C" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-85,120 Q0,145 85,120" stroke="#9A6B28" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Badge text / Arabic indicator subtly at bottom -->
  <text x="256" y="450" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="34" font-weight="700" fill="#E2EBE5" text-anchor="middle" letter-spacing="1">مزرعة الحمام</text>
</svg>
